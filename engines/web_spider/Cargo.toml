[package]
name = "web_spider"
version = "0.1.0"
edition = "2021"
description = "High-performance web asset parser & route extraction engine for BlackRoute-Web"

[dependencies]
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
